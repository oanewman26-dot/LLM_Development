[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auroralm"
version = "0.1.0"
description = "Experimental state-conditioned decoder-only language model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime and test dependencies are pinned in requirements.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "slow: takes several seconds on CPU; deselect with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["auroralm"]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # pycodestyle errors the formatter does not already settle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "B",   # bugbear
    "UP",  # pyupgrade
    "T20", # print(): only the command-line entry points below may print
]
ignore = [
    # zip() over sequences built together; adding strict= would change behaviour.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Modules with a command-line entry point; their printed output is the interface.
"src/auroralm/activation_calibration.py" = ["T20"]
"src/auroralm/dataset.py" = ["T20"]
"src/auroralm/inference.py" = ["T20"]
"src/auroralm/readiness_gate.py" = ["T20"]
"src/auroralm/smollm_sampler.py" = ["T20"]
"src/auroralm/tokenizer.py" = ["T20"]
"src/auroralm/train.py" = ["T20"]
# The smoke test doubles as a runnable script and reports as it goes.
"tests/test_smoke.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/auroralm"]
warn_unused_ignores = true
warn_redundant_casts = true
