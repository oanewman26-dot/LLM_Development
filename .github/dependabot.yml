version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Updates arrive through staging like every other change.
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request for all minor and patch updates. Major versions
      # stay separate, so one breaking release cannot block the rest.
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    # Updates arrive through staging like every other change.
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # Actions are versioned by major release, so group all of them.
      github-actions:
        patterns:
          - "*"
