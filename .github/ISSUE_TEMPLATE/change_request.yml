name: Change request
description: Propose a feature, refactor or documentation change.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Leave out private Aurora records, training corpora, checkpoints and credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The behaviour you want. Keep it to one subsystem; split larger work.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Which public contracts, readiness gates or reproducibility pins this touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
